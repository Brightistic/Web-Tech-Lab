<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Style Edit - Fashion Catalogue (Full Stack)</title>
  <!-- React and Babel are loaded from a CDN so this single file runs without npm -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; background: #fafafa; }
    .container { max-width: 850px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif; }
    h1, h2 { color: #2c2c2c; }
    form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
    input { padding: 10px; border: 1px solid #bbb; border-radius: 4px; }
    button { padding: 10px 14px; border: none; border-radius: 4px; background: #d97757; color: #fff; cursor: pointer; margin: 2px; }
    button.alt { background: #555; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background: #2c2c2c; color: #fff; }
    .stack { font-size: 14px; color: #555; margin-top: -8px; }
    .log { background: #0c0c0c; color: #ccc; font-family: Consolas, monospace; font-size: 13px;
           padding: 10px; border-radius: 4px; min-height: 60px; max-height: 160px; overflow-y: auto; margin-top: 30px; }
    .log div.err { color: #ff7b72; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Student ID: URK24CS1062
    const { useEffect, useState } = React;

    // ---- Stand-in for the Express + MongoDB backend (same routes, validation and status codes) ----
    const store = { products: [], nextId: 1, log: [] };
    const listeners = [];
    function record(line, isErr) { store.log = [...store.log, { line, isErr }]; listeners.forEach(fn => fn()); }

    function fakeFetch(method, path, body) {
      return new Promise(resolve => {
        setTimeout(() => {
          const id = path.split("/")[3];
          let status = 200, data;
          if (method === "GET") {
            data = store.products.map(p => ({ ...p }));
          } else if (method === "POST") {
            const { name, category } = body;
            if (typeof name !== "string" || !name.trim() || typeof category !== "string" || !category.trim()) {
              status = 400; data = { error: "Name and category are required" };
            } else {
              const product = { name: name.trim(), category: category.trim() };
              const _id = "6" + String(store.nextId++).padStart(23, "0");
              store.products.push({ _id, ...product });
              status = 201; data = { _id, ...product };
            }
          } else if (method === "PUT") {
            const i = store.products.findIndex(p => p._id === id);
            const { name, category } = body;
            if (!name || !name.trim() || !category || !category.trim()) {
              status = 400; data = { error: "Name and category are required" };
            } else if (i < 0) {
              status = 404; data = { error: "Product not found" };
            } else {
              store.products[i] = { _id: id, name: name.trim(), category: category.trim() };
              data = { message: "Product updated successfully" };
            }
          } else if (method === "DELETE") {
            const i = store.products.findIndex(p => p._id === id);
            if (i < 0) { status = 404; data = { error: "Product not found" }; }
            else { store.products.splice(i, 1); data = { message: "Product deleted successfully" }; }
          }
          record(method + " " + path + " " + status, status >= 400);
          resolve({ ok: status < 400, status, json: async () => data });
        }, 150);
      });
    }

    const API = "/api/products";

    function App() {
      const [products, setProducts] = useState([]);
      const [name, setName] = useState("");
      const [category, setCategory] = useState("");
      const [editId, setEditId] = useState(null);
      const [message, setMessage] = useState("");
      const [, force] = useState(0);

      useEffect(() => { listeners.push(() => force(n => n + 1)); }, []);

      async function loadProducts() {
        try {
          const response = await fakeFetch("GET", API);
          if (!response.ok) throw new Error("Unable to load products");
          setProducts(await response.json());
        } catch (error) {
          setMessage(error.message);
        }
      }

      useEffect(() => { loadProducts(); }, []);

      async function handleSubmit(event) {
        event.preventDefault();
        setMessage("");
        try {
          const response = await fakeFetch(editId ? "PUT" : "POST", editId ? API + "/" + editId : API, { name, category });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          setName(""); setCategory(""); setEditId(null);
          setMessage(data.message || "Product added successfully");
          await loadProducts();
        } catch (error) {
          setMessage(error.message || "Request failed");
        }
      }

      function editProduct(product) {
        setEditId(product._id); setName(product.name); setCategory(product.category); setMessage("");
      }

      async function deleteProduct(id) {
        if (!window.confirm("Delete this product?")) return;
        try {
          const response = await fakeFetch("DELETE", API + "/" + id);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          setMessage(data.message);
          await loadProducts();
        } catch (error) {
          setMessage(error.message);
        }
      }

      return (
        <main className="container">
          <h1>The Style Edit - Fashion Catalogue</h1>
          <p className="stack">Frontend: React.js &bull; Backend: Node.js + Express.js &bull; Database: MongoDB</p>

          <form onSubmit={handleSubmit} noValidate>
            <input placeholder="Product Name" value={name} onChange={e => setName(e.target.value)} />
            <input placeholder="Category" value={category} onChange={e => setCategory(e.target.value)} />
            <button type="submit">{editId ? "Update Product" : "Add Product"}</button>
            {editId && (
              <button type="button" className="alt" onClick={() => { setEditId(null); setName(""); setCategory(""); }}>
                Cancel
              </button>
            )}
          </form>

          {message && <p role="status">{message}</p>}

          <h2>Product Records</h2>
          <table>
            <thead>
              <tr><th>Name</th><th>Category</th><th>Actions</th></tr>
            </thead>
            <tbody>
              {products.map(product => (
                <tr key={product._id}>
                  <td>{product.name}</td>
                  <td>{product.category}</td>
                  <td>
                    <button onClick={() => editProduct(product)}>Edit</button>
                    <button onClick={() => deleteProduct(product._id)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <div className="log">
            <div>// API calls handled by the (simulated) Express server</div>
            {store.log.map((l, i) => <div key={i} className={l.isErr ? "err" : ""}>{l.line}</div>)}
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
