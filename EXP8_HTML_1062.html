<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Style Edit - React UI</title>
  <!-- React, ReactDOM, React Router and Babel are loaded from a CDN so this single file runs without npm -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-router-dom@5.3.4/umd/react-router-dom.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #fafafa; color: #333; }
    header { background: #2c2c2c; color: white; padding: 20px; text-align: center; }
    header h1 { margin-top: 0; letter-spacing: 2px; }
    nav { display: flex; justify-content: center; gap: 24px; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    nav a:hover { color: #d97757; }
    main { padding: 24px 16px; }
    .card { max-width: 480px; margin: 20px auto; padding: 28px; background: white;
            border-radius: 12px; box-shadow: 0 4px 16px #00000012; }
    .card h2 { text-align: center; color: #2c2c2c; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: bold; }
    input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    input:focus, select:focus { outline: 2px solid #f0c4b3; border-color: #d97757; }
    small { display: block; color: #dc2626; margin-top: 5px; }
    button, .button { display: inline-block; margin-top: 20px; padding: 12px 18px; background: #d97757;
                      color: white; border: none; border-radius: 6px; text-decoration: none;
                      cursor: pointer; font-size: 15px; }
    button { width: 100%; }
    button:disabled { background: #b8b8b8; cursor: not-allowed; }
    .success { color: #15803d; font-weight: bold; text-align: center; }
    @media (max-width: 600px) { .card { padding: 18px; } nav { gap: 16px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Student ID: URK24CS1062
    const { useState } = React;
    const { HashRouter, Switch, Route, Link } = ReactRouterDOM;

    function Home() {
      return (
        <div className="card">
          <h2>Welcome to The Style Edit</h2>
          <p>
            Your online fashion magazine. Join the Style Club to get weekly
            trend reports, street style stories and shopping edits.
          </p>
          <Link className="button" to="/register">Join the Style Club</Link>
        </div>
      );
    }

    function Register() {
      const [form, setForm] = useState({
        name: "", email: "", password: "", age: "", mobile: "", gender: "", state: ""
      });
      const [submitted, setSubmitted] = useState(false);

      const updateField = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
        setSubmitted(false);
      };

      const errors = {
        name: !/^[A-Za-z ]+$/.test(form.name.trim()),
        email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email),
        password: !/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(form.password),
        age: !/^\d+$/.test(form.age) || Number(form.age) < 18 || Number(form.age) > 30,
        mobile: !/^\d{10}$/.test(form.mobile),
        gender: !form.gender,
        state: !form.state
      };

      const valid =
        form.name.trim() !== "" && !errors.name &&
        !errors.email && form.email !== "" &&
        !errors.password &&
        !errors.age && form.age !== "" &&
        !errors.mobile && !errors.gender && !errors.state;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (valid) setSubmitted(true);
      };

      return (
        <div className="card">
          <h2>Style Club Registration</h2>
          <form onSubmit={handleSubmit} noValidate>
            <label>Full Name</label>
            <input name="name" value={form.name} onChange={updateField} placeholder="Enter your name" required />
            {form.name && errors.name && <small>Name must contain letters only.</small>}

            <label>Email Address</label>
            <input name="email" type="email" value={form.email} onChange={updateField} placeholder="Enter your email" required />
            {form.email && errors.email && <small>Enter a valid email address.</small>}

            <label>Password</label>
            <input name="password" type="password" value={form.password} onChange={updateField} placeholder="Minimum 8 characters" required />
            {form.password && errors.password && (
              <small>Use uppercase, lowercase, a number and at least 8 characters.</small>
            )}

            <label>Age</label>
            <input name="age" type="number" value={form.age} onChange={updateField} placeholder="Enter age (18–30)" required />
            {form.age && errors.age && <small>Age must be between 18 and 30.</small>}

            <label>Mobile Number</label>
            <input name="mobile" type="tel" value={form.mobile} onChange={updateField} placeholder="10-digit mobile number" required />
            {form.mobile && errors.mobile && <small>Enter exactly 10 digits.</small>}

            <label>Gender</label>
            <select name="gender" value={form.gender} onChange={updateField} required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            {form.gender === "" && <small>Gender is required.</small>}

            <label>State</label>
            <select name="state" value={form.state} onChange={updateField} required>
              <option value="">Select state</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Kerala">Kerala</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
            </select>
            {form.state === "" && <small>State is required.</small>}

            <button type="submit" disabled={!valid}>Join the Style Club</button>

            {submitted && (
              <p className="success">Welcome to the Style Club! Registration completed successfully.</p>
            )}
          </form>
        </div>
      );
    }

    function App() {
      return (
        <HashRouter>
          <header>
            <h1>The Style Edit</h1>
            <nav>
              <Link to="/">Home</Link>
              <Link to="/register">Registration</Link>
            </nav>
          </header>
          <main>
            <Switch>
              <Route exact path="/"><Home /></Route>
              <Route path="/register"><Register /></Route>
            </Switch>
          </main>
        </HashRouter>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
