<!DOCTYPE html>
<html>
<head>
  <title>Online Fashion Magazine</title>
  <style>
    /* Simple, clean styling */
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2c2c2c;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    header h1 {
      margin: 0;
      letter-spacing: 2px;
    }
    #subscribeBtn {
      margin-top: 10px;
      padding: 8px 16px;
      background: #d97757;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    #subscribeMsg {
      color: #d97757;
      font-weight: bold;
    }
    .articles {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      justify-content: center;
    }
    .article {
      background: #fff;
      border: 1px solid #ddd;
      width: 200px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
    }
    .article:hover {
      background: #f0e6e0;
    }
    .article h3 {
      margin-top: 0;
    }
    #demo {
      text-align: center;
      padding: 15px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Header section -->
  <header>
    <h1>The Style Edit</h1>
    <p>Your Online Fashion Magazine</p>
    <button id="subscribeBtn">Subscribe</button>
    <p id="subscribeMsg"></p>
  </header>

  <!-- Article cards, all share the class "article" -->
  <div class="articles">
    <div class="article" id="art1">
      <h3>Autumn Trends</h3>
      <p>What to wear this season.</p>
    </div>
    <div class="article" id="art2">
      <h3>Street Style</h3>
      <p>Looks spotted around the city.</p>
    </div>
    <div class="article" id="art3">
      <h3>Accessories 101</h3>
      <p>Small details, big impact.</p>
    </div>
  </div>

  <!-- This text changes when the page loads (like document.getElementById in the lab example) -->
  <p id="demo">Loading today's edition...</p>

  <script>
    // Student ID: URK24CS1062

    // 1. Finding element by Id
    var demoText = document.getElementById("demo");

    // 2. Finding elements by Class Name
    var allArticles = document.getElementsByClassName("article");

    // 3. Finding elements by CSS Selector
    var allHeadings = document.querySelectorAll(".article h3");

    // Event: runs once when the whole page finishes loading
    window.onload = function () {
      demoText.innerHTML = "Welcome to The Style Edit — " + allArticles.length + " new articles today!";
    };

    // Event: click on Subscribe button
    document.getElementById("subscribeBtn").addEventListener("click", function () {
      document.getElementById("subscribeMsg").innerHTML = "Thanks for subscribing!";
    });

    // Event: click on each article card (loop through all articles)
    for (var i = 0; i < allArticles.length; i++) {
      allArticles[i].addEventListener("click", function () {
        alert("You clicked on: " + this.querySelector("h3").innerHTML);
      });
    }

    // Event: mouseover on the header title
    document.querySelector("header h1").addEventListener("mouseover", function () {
      this.style.color = "#d97757";
    });

    // Event: mouseout resets the color
    document.querySelector("header h1").addEventListener("mouseout", function () {
      this.style.color = "#fff";
    });
  </script>

</body>
</html>
